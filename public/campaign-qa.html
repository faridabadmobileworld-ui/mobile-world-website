<!doctype html>
<html lang="hi"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile World · Layout QA</title>
<style>body{margin:0;background:#e8eaed;font:14px system-ui;color:#202124}header{position:sticky;top:0;z-index:2;background:white;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}select,button{font:inherit;padding:8px}main{padding:20px}iframe{display:block;border:0;background:white;transform-origin:top left}#holder{margin:auto;overflow:hidden}label{display:flex;align-items:center;gap:8px}</style>
<header><b>Mobile World · Responsive QA</b><label>Screen width <select id="width"><option>320</option><option>360</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option><option>1920</option></select></label><label>Page <select id="page"><option value="/">Home</option><option value="/posts/redmi-note-17-pro-max-5g-features-faridabad">Featured article</option><option value="/products?brand=xiaomi#smartphones">Xiaomi models</option></select></label><button id="refresh">Reload preview</button><output id="metrics"></output></header>
<main><div id="holder"><iframe id="preview" title="Responsive website preview" src="/" height="1000"></iframe></div></main>
<script>const frame=document.getElementById('preview'),holder=document.getElementById('holder'),width=document.getElementById('width'),page=document.getElementById('page');function resize(){const w=Number(width.value),scale=Math.min(1,(innerWidth-40)/w);frame.style.width=w+'px';frame.style.height=(1000/scale)+'px';frame.style.transform='scale('+scale+')';holder.style.width=w*scale+'px';holder.style.height='1000px';document.getElementById('metrics').value=w+'px viewport';}width.onchange=resize;page.onchange=()=>{frame.src=page.value};document.getElementById('refresh').onclick=()=>{frame.src=page.value};window.onresize=resize;resize();</script></html>
